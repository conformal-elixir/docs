name: Build and deploy docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - index.html
      - batata/index.html
      - CNAME
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - index.html
      - batata/index.html
      - CNAME
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "27.3"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout public documentation sources
        run: |
          git clone --depth 1 https://github.com/beaver-lodge/beaver.git
          git clone https://github.com/beaver-lodge/kinda.git
          git -C kinda checkout "$(jq -er '.kinda.ref' beaver/native-deps.json)"

      - name: Install Mix package managers
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install prebuilt LLVM/MLIR
        run: bash beaver/scripts/install-prebuilt-llvm.sh llvm-prebuilt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Kinda docs
        working-directory: kinda
        run: |
          mix deps.get
          mix docs

      - name: Build Beaver docs
        working-directory: beaver
        env:
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          BEAVER_MAKE_FORCE_BUILD: "1"
        run: |
          mix deps.get
          mix docs

      - name: Assemble site
        run: |
          mkdir -p site/batata
          cp -R beaver/doc site/beaver
          cp -R kinda/doc site/kinda
          cp batata/index.html site/batata/index.html
          cp index.html site/index.html
          cp CNAME site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
